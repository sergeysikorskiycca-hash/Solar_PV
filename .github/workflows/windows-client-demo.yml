name: Windows client demo

on:
  workflow_dispatch:

concurrency:
  group: windows-client-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Automatically bump Windows client patch version
        shell: pwsh
        run: |
          if (${{ github.ref != 'refs/heads/main' }}) { throw "Run this release workflow from main only." }
          [xml]$project = Get-Content "Windows_Client/SolarPV.Client.csproj"
          $currentVersion = [version]$project.Project.PropertyGroup.Version
          $nextVersion = "{0}.{1}.{2}" -f $currentVersion.Major, $currentVersion.Minor, ($currentVersion.Build + 1)
          $projectPath = "Windows_Client/SolarPV.Client.csproj"
          $content = Get-Content $projectPath -Raw
          $content = [regex]::Replace($content, '<Version>[^<]+</Version>', "<Version>$nextVersion</Version>", 1)
          [System.IO.File]::WriteAllText($projectPath, $content, [System.Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $projectPath
          git commit -m "Bump Windows client version to $nextVersion"
          git push origin HEAD:main
      - name: Read client version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "Windows_Client/SolarPV.Client.csproj"
          $appVersion = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($appVersion)) { throw "Client version is missing from the project file." }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained portable Windows app
        run: dotnet publish Windows_Client/SolarPV.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o Windows_Client/publish
      - name: Write package version
        shell: pwsh
        run: |
          $appVersion = "${{ steps.version.outputs.app_version }}"
          [System.IO.File]::WriteAllText("Windows_Client/publish/version.txt", $appVersion, [System.Text.UTF8Encoding]::new($false))
      - name: Create portable update package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "Windows_Client/publish/*" -DestinationPath "dist/Solar_PV_Windows_Portable_Update.zip" -CompressionLevel Optimal
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build standalone installer
        shell: pwsh
        run: |
          $appVersion = "${{ steps.version.outputs.app_version }}"
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "/DMyAppVersion=$appVersion" "Windows_Client/installer/Solar_PV.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish installer and portable update package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $appVersion = "${{ steps.version.outputs.app_version }}"
          gh release view solar-pv-windows-demo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create solar-pv-windows-demo --title "Solar_PV Windows $appVersion" --notes "Версия клиента: $appVersion"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload solar-pv-windows-demo dist/Solar_PV_Windows_Demo_Setup.exe dist/Solar_PV_Windows_Portable_Update.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes = "Версия клиента: $appVersion" + [Environment]::NewLine + [Environment]::NewLine + "Установщик Windows 10/11 x64 и portable-пакет обновления. Обновление выполняется внутри программы без повторного запуска установщика."
          gh release edit solar-pv-windows-demo --title "Solar_PV Windows $appVersion" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
