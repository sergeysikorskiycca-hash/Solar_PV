name: ESP32 Admin build

on:
  push:
    branches:
      - esp32-admin-refactor
    paths:
      - "ESP32_Admin/**"
      - ".github/workflows/esp32-admin-build.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Arduino indexes
        run: arduino-cli core update-index

      - name: Install ESP32 platform
        run: arduino-cli core install esp32:esp32

      - name: Install display libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"

      - name: Compile for ESP32 Dev Module
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all ESP32_Admin

      - name: Package sketch folder
        if: success()
        run: zip -r ESP32_Admin.zip ESP32_Admin

      - name: Upload sketch ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_Admin
          path: ESP32_Admin.zip
          if-no-files-found: error
