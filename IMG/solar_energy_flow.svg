<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142b42"/><stop offset="1" stop-color="#081725"/></linearGradient>
  <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#eaf1f5"/><stop offset=".5" stop-color="#9aabba"/><stop offset="1" stop-color="#526b7e"/></linearGradient>
  <linearGradient id="pv" x2="1" y2="1"><stop stop-color="#2879aa"/><stop offset=".55" stop-color="#123d67"/><stop offset="1" stop-color="#081d36"/></linearGradient>
  <linearGradient id="battery" x2="0" y2="1"><stop stop-color="#536f82"/><stop offset="1" stop-color="#1a3041"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4bc5ff"/></marker>
  <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc65d"/></marker>
  <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5be6a0"/></marker>
  <style>
    text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#eef7ff}
    .heading{font-size:22px;font-weight:bold;letter-spacing:1px}
    .sub{font-size:15px;fill:#adc2d1}
    .wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .plate{fill:#10283e;stroke:#496a82;stroke-width:2}
  </style>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<g opacity=".11" stroke="#77a0ba" stroke-width="1">
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
  <path d="M100 0V760M200 0V760M300 0V760M400 0V760M500 0V760M600 0V760M700 0V760M800 0V760M900 0V760M1000 0V760M1100 0V760"/>
</g>
<text x="600" y="39" text-anchor="middle" font-size="27" font-weight="bold" letter-spacing="3">SOLAR POWER SYSTEM</text>
<text x="600" y="65" text-anchor="middle" class="sub">ДОМАШНЯЯ ЭНЕРГОСИСТЕМА · СХЕМА ПОТОКОВ ЭНЕРГИИ</text>

<!-- connections, all leading to the central inverter -->
<path d="M305 374H430" class="wire" stroke="#ffc65d" marker-end="url(#goldArrow)" filter="url(#glow)"/>
<path d="M600 205V245" class="wire" stroke="#ffc65d" marker-end="url(#goldArrow)" filter="url(#glow)"/>
<path d="M920 255H820V315H770" class="wire" stroke="#4bc5ff" marker-end="url(#blueArrow)" filter="url(#glow)"/>
<path d="M920 485H850V455H770" class="wire" stroke="#4bc5ff" marker-end="url(#blueArrow)" filter="url(#glow)"/>
<path d="M600 590V505" class="wire" stroke="#5be6a0" marker-end="url(#greenArrow)" filter="url(#glow)"/>

<!-- HOUSE: left side -->
